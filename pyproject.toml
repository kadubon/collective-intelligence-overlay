[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "collective-intelligence-overlay"
version = "0.4.2"
description = "Evidence sharing and local admission for reusable agent capabilities"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.13.5,<3",
    "httpx>=0.28.1,<1",
    "sqlalchemy>=2.1.1,<3",
    "alembic>=1.20,<2",
    "pg8000>=1.31,<2",
    "securesystemslib[crypto]>=1.5.1,<2",
    "pyjwt[crypto]>=2.12,<3",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
agents = [
    "agent-framework-core>=1.19,<1.20",
    "a2a-sdk[http-server]>=1.1.5,<1.2",
    "mcp>=2.2,<2.3",
    "uvicorn>=0.41,<1",
    "httpx2>=2,<3",
]
model = [
    "agent-framework-openai>=1.14.4,<1.15",
]
ollama = [
    "agent-framework-ollama==1.0.0b260813",
]

[project.scripts]
collective-intelligence-overlay = "collective_intelligence_overlay.cli:main"

[project.urls]
Repository = "https://github.com/kadubon/collective-intelligence-overlay"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "hypothesis>=6,<7",
    "ruff>=0.15,<1",
    "mypy>=1.19,<2",
    "pytest-cov>=7,<8",
    "twine>=6,<7",
    "pip-audit>=2.10,<3",
    "cyclonedx-bom>=7,<8",
    "pip-licenses>=5,<6",
    "types-protobuf>=7.35.1.20260906",
    "scipy>=1.18.1,<1.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["collective_intelligence_overlay"]
