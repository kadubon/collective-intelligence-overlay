name: Test, build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Representative Linux checkpoint or final native full matrix'
        required: true
        type: choice
        options: [representative, full]
        default: representative
      candidate_run_id:
        description: 'Reuse the original candidate run artifact ID; empty builds a new candidate'
        required: false
        type: string
      production_protocols:
        description: 'Run the formal no-model soak and all five matched pairs on this candidate'
        required: false
        type: boolean
        default: false
      verify_pypi:
        description: 'For a reused candidate, verify actual no-cache PyPI files and installations'
        required: false
        type: boolean
        default: true
      publish_existing_tag:
        description: 'Explicitly resume the pinned v0.4.1 tag without moving or rebuilding it'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quick:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: '3.12.14'
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/runtime_matrix.py --check-docs
      - run: uv run python scripts/check_gemma_report.py
      - run: uv run pytest tests/unit/test_artifacts.py tests/unit/test_artifact_crash.py tests/unit/test_backup_minimum.py tests/unit/test_release_candidate.py tests/unit/test_release_gate.py tests/unit/test_publication_resume.py tests/unit/test_native_fault_profile.py tests/unit/test_gemma_public.py -q --junitxml=.local/quick-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quick-observations
          path: .local/quick-tests.xml
          if-no-files-found: error

  candidate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
      windows: ${{ steps.matrix.outputs.windows }}
      macos: ${{ steps.matrix.outputs.macos }}
      cross: ${{ steps.matrix.outputs.cross }}
      minimum: ${{ steps.matrix.outputs.minimum }}
      latest: ${{ steps.matrix.outputs.latest }}
      from_pypi: ${{ steps.pypi.outputs.from_pypi }}
      production_run_id: ${{ steps.selection.outputs.production_run_id }}
      reuse_run_id: ${{ steps.selection.outputs.reuse_run_id }}
      pretested_full: ${{ steps.selection.outputs.pretested_full }}
      release_manifest: ${{ inputs.publish_existing_tag && 'docs/release-041.json' || steps.selection.outputs.release_manifest }}
    env:
      CIO_VALIDATION_SCOPE: ${{ inputs.validation_scope || 'full' }}
      CIO_PUBLICATION_RESUME: ${{ inputs.publish_existing_tag && 'true' || 'false' }}
      CIO_PRODUCTION_PROTOCOLS: ${{ inputs.production_protocols && 'true' || 'false' }}
      CIO_VERIFY_PYPI: ${{ inputs.verify_pypi && 'true' || 'false' }}
      CIO_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.publish_existing_tag && 'refs/tags/v0.4.1' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain the actual recovery workflow source separately from the tag
        if: inputs.publish_existing_tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: .local/publication-workflow
          fetch-depth: 0
          persist-credentials: false
      - id: matrix
        env:
          CIO_REPRESENTATIVE: ${{ inputs.validation_scope == 'representative' }}
        run: python scripts/runtime_matrix.py --github-output
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ steps.matrix.outputs.minimum }}
      - run: uv sync --all-extras --frozen
      - id: selection
        name: Select the immutable release candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CIO_PUBLICATION_RESUME" == true ]]; then
            uv run python .local/publication-workflow/.github/scripts/publication_resume.py select --engine-root .local/publication-workflow --tag-root .
          else
            uv run python scripts/release_candidate.py
          fi
      - name: Check actual build interpreter and release ancestry
        run: |
          uv run python -c "import platform,sys; assert platform.python_version()=='${{ steps.matrix.outputs.minimum }}'; print(sys.version,sys.executable)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            uv run python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME']=='v'+v"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - if: steps.selection.outputs.reuse_run_id == ''
        run: uv build --force-pep517 --python '${{ steps.matrix.outputs.minimum }}' --out-dir .local/candidate/dist
      - run: uv run twine check --strict .local/candidate/dist/*
        if: steps.selection.outputs.reuse_run_id == ''
      - name: Fix candidate hashes once
        if: steps.selection.outputs.reuse_run_id == ''
        run: |
          uv run python -c "import hashlib,json; from pathlib import Path; p=Path('.local/candidate'); (p/'artifacts.json').write_text(json.dumps({f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in (p/'dist').iterdir() if f.name.endswith(('.whl','.tar.gz'))},indent=2)+'\n')"
          uv run python scripts/release_gate.py provenance --candidate .local/candidate
      - name: Restore the originally tested publication candidate
        if: steps.selection.outputs.reuse_run_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
          run-id: ${{ steps.selection.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Compare actual PyPI bytes with the original candidate
        id: pypi
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != '' && !inputs.production_protocols && inputs.verify_pypi
        shell: bash
        run: |
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          uv run python scripts/fetch_pypi_release.py --version "$version" --hash-file .local/candidate/artifacts.json --output .local/pypi/dist --report .local/candidate/pypi-download.json
          echo 'from_pypi=true' >> "$GITHUB_OUTPUT"
      - name: Reject changes to packaged sources and the pretested pair
        run: uv run python scripts/release_candidate.py --candidate .local/candidate
      - name: Verify actual recovery engine and pinned candidate identity
        if: inputs.publish_existing_tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python .local/publication-workflow/.github/scripts/publication_resume.py verify --engine-root .local/publication-workflow --tag-root .
      - name: Restore the original complete gate
        if: steps.selection.outputs.pretested_full == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-gate
          path: .local/release-gate
          run-id: ${{ steps.selection.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Verify trusted gate, unchanged lock and validation sources
        if: steps.selection.outputs.pretested_full == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/release_gate.py reuse --candidate .local/candidate --gate .local/release-gate/report.json --manifest '${{ inputs.publish_existing_tag && 'docs/release-041.json' || steps.selection.outputs.release_manifest }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-distributions
          path: .local/candidate/
          include-hidden-files: true
          if-no-files-found: error

  linux:
    needs: candidate
    if: needs.candidate.outputs.pretested_full != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate.outputs.linux) }}
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CIO_TEST_DATABASE_URL: postgresql+pg8000://postgres:test-only-password@127.0.0.1:5432/postgres
      CIO_OPA: ${{ github.workspace }}/.local/bin/opa
      CIO_SCALE_REPORT_DIR: .local/reports/scale
      CIO_FROM_PYPI: ${{ needs.candidate.outputs.from_pypi }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/fetch_opa.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.candidate.outputs.pretested_full != 'true'
        with:
          path: |
            .local/proxy-build/go-modules
            .local/proxy-build/go-cache
          key: cio-proxy-v1-${{ runner.os }}-${{ runner.arch }}-go1.27.1-${{ hashFiles('scripts/proxy/go.mod', 'scripts/proxy/go.sum', 'scripts/fetch_caddy.py') }}
      - run: uv run python scripts/fetch_caddy.py
      - run: uv run python scripts/ci_validate.py --python-version '${{ matrix.python }}' --architecture '${{ matrix.architecture }}' --candidate .local/candidate --report-dir .local/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-Linux-${{ matrix.architecture }}-${{ matrix.python }}-full
          path: .local/reports/
          include-hidden-files: true
          if-no-files-found: error

  windows:
    needs: candidate
    if: needs.candidate.outputs.pretested_full != 'true' && (github.event_name != 'workflow_dispatch' || inputs.validation_scope == 'full')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate.outputs.windows) }}
    env:
      CIO_TEST_DATABASE_URL: postgresql+pg8000://postgres@127.0.0.1:55439/postgres
      CIO_OPA: ${{ github.workspace }}/.local/bin/opa.exe
      CIO_SCALE_REPORT_DIR: .local/reports/scale
      CIO_FROM_PYPI: ${{ needs.candidate.outputs.from_pypi }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - name: Start a private runner PostgreSQL cluster
        shell: pwsh
        run: |
          uv run --no-project python scripts/private_postgres.py start --bin "$env:PGBIN" --data "$env:RUNNER_TEMP/cio-postgres"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PGBIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/fetch_opa.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.candidate.outputs.pretested_full != 'true'
        with:
          path: |
            .local/proxy-build/go-modules
            .local/proxy-build/go-cache
          key: cio-proxy-v1-${{ runner.os }}-${{ runner.arch }}-go1.27.1-${{ hashFiles('scripts/proxy/go.mod', 'scripts/proxy/go.sum', 'scripts/fetch_caddy.py') }}
      - run: uv run python scripts/fetch_caddy.py
      - run: uv run python scripts/ci_validate.py --python-version '${{ matrix.python }}' --architecture '${{ matrix.architecture }}' --candidate .local/candidate --report-dir .local/reports
      - name: Stop only the private Windows cluster
        if: always()
        shell: pwsh
        run: uv run --no-project python scripts/private_postgres.py stop --bin "$env:PGBIN" --data "$env:RUNNER_TEMP/cio-postgres"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-Windows-${{ matrix.architecture }}-${{ matrix.python }}-full
          path: .local/reports/
          include-hidden-files: true
          if-no-files-found: error

  macos:
    needs: candidate
    if: needs.candidate.outputs.pretested_full != 'true' && (github.event_name != 'workflow_dispatch' || inputs.validation_scope == 'full')
    runs-on: ${{ matrix.runner }}
    # Intel source validation alone took 53 minutes; source plus installed
    # suites and audited Go build share this finite job budget.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate.outputs.macos) }}
    env:
      CIO_TEST_DATABASE_URL: postgresql+pg8000://postgres@127.0.0.1:55439/postgres
      CIO_OPA: ${{ github.workspace }}/.local/bin/opa
      CIO_SCALE_REPORT_DIR: .local/reports/scale
      CIO_FROM_PYPI: ${{ needs.candidate.outputs.from_pypi }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - name: Locate native PostgreSQL and start an isolated cluster
        shell: bash
        run: |
          if ! brew list --versions postgresql@17; then brew install postgresql@17; fi
          pg_bin="$(brew --prefix postgresql@17)/bin"
          echo "CIO_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
          echo "$pg_bin" >> "$GITHUB_PATH"
          uv run --no-project python scripts/private_postgres.py start --bin "$pg_bin" --data "$RUNNER_TEMP/cio-postgres"
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/fetch_opa.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.candidate.outputs.pretested_full != 'true'
        with:
          path: |
            .local/proxy-build/go-modules
            .local/proxy-build/go-cache
          key: cio-proxy-v1-${{ runner.os }}-${{ runner.arch }}-go1.27.1-${{ hashFiles('scripts/proxy/go.mod', 'scripts/proxy/go.sum', 'scripts/fetch_caddy.py') }}
      - run: uv run python scripts/fetch_caddy.py
      - run: uv run python scripts/ci_validate.py --python-version '${{ matrix.python }}' --architecture '${{ matrix.architecture }}' --candidate .local/candidate --report-dir .local/reports
      - name: Stop only the private Mac cluster
        if: always() && env.CIO_PG_BIN != ''
        shell: bash
        run: uv run --no-project python scripts/private_postgres.py stop --bin "$CIO_PG_BIN" --data "$RUNNER_TEMP/cio-postgres"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-Darwin-${{ matrix.architecture }}-${{ matrix.python }}-full
          path: .local/reports/
          include-hidden-files: true
          if-no-files-found: error

  mixed:
    needs: candidate
    if: needs.candidate.outputs.pretested_full != 'true' && (github.event_name != 'workflow_dispatch' || inputs.validation_scope == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CIO_TEST_DATABASE_URL: postgresql+pg8000://postgres:test-only-password@127.0.0.1:5432/postgres
      CIO_OPA: ${{ github.workspace }}/.local/bin/opa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ needs.candidate.outputs.minimum }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/fetch_opa.py
      - run: uv run python scripts/check_python_interop.py --candidate .local/candidate --minimum '${{ needs.candidate.outputs.minimum }}' --latest '${{ needs.candidate.outputs.latest }}' --report .local/reports/mixed-python.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-mixed
          path: .local/reports/
          include-hidden-files: true
          if-no-files-found: error

  cross:
    needs: [candidate, linux, windows, macos]
    if: needs.candidate.outputs.pretested_full != 'true' && (github.event_name != 'workflow_dispatch' || inputs.validation_scope == 'full')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate.outputs.cross) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: reports-*-full
          path: .local/origins
      - name: Verify every native producer with an installed native reader
        shell: bash
        run: |
          uv venv --python '${{ matrix.python }}' .local/cross
          if [[ "$RUNNER_OS" == Windows ]]; then cross_python=.local/cross/Scripts/python.exe; else cross_python=.local/cross/bin/python; fi
          uv pip install --python "$cross_python" .local/candidate/dist/*.whl
          "$cross_python" scripts/check_platform_interop.py --candidate .local/candidate --reports .local/origins --output .local/reports/cross-platform.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-cross-${{ matrix.os }}-${{ matrix.architecture }}-${{ matrix.python }}
          path: .local/reports/
          include-hidden-files: true
          if-no-files-found: error

  production:
    needs: candidate
    if: inputs.production_protocols || needs.candidate.outputs.production_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      CIO_TEST_DATABASE_URL: postgresql+pg8000://postgres@127.0.0.1:55439/postgres
      CIO_OPA: ${{ github.workspace }}/.local/bin/opa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ needs.candidate.outputs.minimum }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - name: Restore original formal production observations
        if: needs.candidate.outputs.production_run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wait_production_artifact.py --run-id '${{ needs.candidate.outputs.production_run_id }}'
      - name: Download original formal production observations
        if: needs.candidate.outputs.production_run_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: reports-production
          path: .local/production-reports
          run-id: ${{ needs.candidate.outputs.production_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.candidate.outputs.production_run_id == ''
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.candidate.outputs.pretested_full != 'true'
        with:
          path: |
            .local/proxy-build/go-modules
            .local/proxy-build/go-cache
          key: cio-proxy-v1-${{ runner.os }}-${{ runner.arch }}-go1.27.1-${{ hashFiles('scripts/proxy/go.mod', 'scripts/proxy/go.sum', 'scripts/fetch_caddy.py') }}
      - name: Run formal protocols on the normally installed pair
        if: needs.candidate.outputs.production_run_id == ''
        shell: bash
        run: |
          set -eu
          uv sync --all-extras --frozen
          pg_bin="$(pg_config --bindir)"
          echo "CIO_PRODUCTION_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
          uv run --no-project python scripts/private_postgres.py start --bin "$pg_bin" --data "$RUNNER_TEMP/production-postgres"
          uv run python scripts/fetch_opa.py
          uv run python scripts/fetch_caddy.py
          uv venv --python '${{ needs.candidate.outputs.minimum }}' .local/production-env
          candidate_wheel=(.local/candidate/dist/*.whl)
          uv pip install --python .local/production-env/bin/python "${candidate_wheel[0]}[agents]" pytest pytest-asyncio hypothesis
          .local/production-env/bin/python scripts/run_production_soak.py --candidate .local/candidate --opa "$CIO_OPA" --caddy .local/proxy-build/caddy --output .local/production-reports/soak --private "$RUNNER_TEMP/soak-private" --contention-notes 'Dedicated hosted job; native Linux, shared runner hardware without CPU isolation; no other peer protocol in this job'
          .local/production-env/bin/python scripts/run_production_experiment.py --candidate .local/candidate --opa "$CIO_OPA" --caddy .local/proxy-build/caddy --output .local/production-reports/experiment --private "$RUNNER_TEMP/experiment-private" --contention-notes 'Same hosted job after soak physical shutdown; native Linux, shared runner hardware without CPU isolation; arms run sequentially'
          .local/production-env/bin/python -c "import sys; sys.path.insert(0,'scripts'); import json; from pathlib import Path; from check_production_reports import file_manifest; p=Path('.local/production-reports'); (p/'file-manifest.json').write_text(json.dumps(file_manifest(p),sort_keys=True,indent=2)+'\n')"
      - name: Stop only the native production test cluster
        if: always() && env.CIO_PRODUCTION_PG_BIN != ''
        run: uv run --no-project python scripts/private_postgres.py stop --bin "$CIO_PRODUCTION_PG_BIN" --data "$RUNNER_TEMP/production-postgres"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-production
          path: .local/production-reports/
          include-hidden-files: true
          if-no-files-found: error

  ready:
    needs: [candidate, linux, windows, macos, mixed, cross, production]
    if: >-
      !cancelled() && needs.candidate.result == 'success' &&
      (needs.candidate.outputs.pretested_full == 'true' ||
      (needs.linux.result == 'success' && needs.windows.result == 'success' &&
      needs.macos.result == 'success' && needs.mixed.result == 'success' &&
      needs.cross.result == 'success' &&
      (needs.production.result == 'success' || needs.production.result == 'skipped')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CIO_VALIDATION_SCOPE: full
      CIO_PUBLICATION_RESUME: ${{ inputs.publish_existing_tag && 'true' || 'false' }}
      CIO_PRODUCTION_PROTOCOLS: ${{ inputs.production_protocols && 'true' || 'false' }}
      CIO_VERIFY_PYPI: ${{ inputs.verify_pypi && 'true' || 'false' }}
      CIO_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.publish_existing_tag && 'refs/tags/v0.4.1' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain the actual recovery workflow source separately from the tag
        if: inputs.publish_existing_tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: .local/publication-workflow
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ needs.candidate.outputs.minimum }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.candidate.outputs.pretested_full != 'true'
        with:
          pattern: reports-*
          path: .local/reports
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.candidate.outputs.pretested_full == 'true'
        with:
          pattern: reports-*
          path: .local/reports
          run-id: ${{ needs.candidate.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.candidate.outputs.pretested_full == 'true'
        with:
          name: release-gate
          path: .local/release-gate
          run-id: ${{ needs.candidate.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.candidate.outputs.pretested_full == 'true'
        with:
          name: proxy-source-review
          path: .local/reports/proxy-source-review
          run-id: ${{ needs.candidate.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - run: uv sync --all-extras --frozen --python '${{ needs.candidate.outputs.minimum }}'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.candidate.outputs.pretested_full != 'true'
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.candidate.outputs.pretested_full != 'true'
        with:
          path: |
            .local/proxy-build/go-modules
            .local/proxy-build/go-cache
          key: cio-proxy-v1-${{ runner.os }}-${{ runner.arch }}-go1.27.1-${{ hashFiles('scripts/proxy/go.mod', 'scripts/proxy/go.sum', 'scripts/fetch_caddy.py') }}
      - name: Audit all native proxy source graphs and reassess original production observations
        if: needs.candidate.outputs.pretested_full != 'true'
        shell: bash
        run: |
          set -eu
          uv run python scripts/fetch_caddy.py
          uv run python scripts/check_proxy_sources.py --reports .local/reports --candidate .local/candidate --cache .local/proxy-build/go-modules --goroot "$(go env GOROOT)" --output .local/reports/proxy-source-review
          if [[ '${{ needs.production.result }}' == success ]]; then uv run python scripts/check_production_reports.py --candidate .local/candidate --reports .local/reports; fi
      - run: uv run --frozen python scripts/check_matrix.py --candidate .local/candidate --reports .local/reports
      - name: Verify the unchanged tag and actual recovery workflow again
        if: inputs.publish_existing_tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python .local/publication-workflow/.github/scripts/publication_resume.py verify --engine-root .local/publication-workflow --tag-root .
      - name: Compare all restored reports with the original complete gate
        if: needs.candidate.outputs.pretested_full == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/release_gate.py reuse --candidate .local/candidate --reports .local/reports --gate .local/release-gate/report.json --manifest '${{ needs.candidate.outputs.release_manifest }}'
      - name: Retain a complete hash-bound native gate
        if: needs.candidate.outputs.pretested_full != 'true'
        run: uv run python scripts/release_gate.py attest --candidate .local/candidate --reports .local/reports --gate .local/release-gate/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.candidate.outputs.pretested_full != 'true'
        with:
          name: release-gate
          path: .local/release-gate
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && needs.candidate.outputs.pretested_full != 'true'
        with:
          name: proxy-source-review
          path: .local/reports/proxy-source-review/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: >-
      !cancelled() && needs.candidate.result == 'success' &&
      needs.ready.result == 'success' &&
      github.repository == 'kadubon/collective-intelligence-overlay' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.publish_existing_tag && inputs.validation_scope == 'full' &&
      !inputs.production_protocols && !inputs.verify_pypi && needs.quick.result == 'success'))
    needs: [candidate, ready, quick]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/collective-intelligence-overlay/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: candidate
      - name: Recheck publish files against the tested manifest
        run: |
          python -c "import hashlib,json; from pathlib import Path; p=Path('candidate'); assert json.loads((p/'artifacts.json').read_text())=={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in (p/'dist').iterdir() if f.name.endswith(('.whl','.tar.gz'))}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: candidate/dist/
