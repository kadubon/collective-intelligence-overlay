name: Test, build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CIO_TEST_DATABASE_URL: postgresql+pg8000://postgres:test-only-password@127.0.0.1:5432/postgres
      CIO_OPA: ${{ github.workspace }}/.local/bin/opa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/fetch_opa.py
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest --cov=collective_intelligence_overlay --cov-report=term-missing
      - run: uv run python scripts/check_docs.py
      - run: uv run pip-audit --progress-spinner off --cache-dir .local/audit-cache
      - run: uv run pip-licenses --format=json --with-urls --output-file=licenses.json
      - run: uv run python scripts/check_licenses.py licenses.json
      - run: uv run cyclonedx-py environment --output-file sbom.json
      - name: Check release version and branch ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME']=='v'+v"
          git merge-base --is-ancestor HEAD origin/main
      - run: uv build
      - run: uv run twine check --strict dist/*
      - run: uv run python scripts/check_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain
          path: |
            licenses.json
            sbom.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
      - run: uv sync --all-extras --frozen
      - run: uv run pytest tests/unit
      - run: uv build
      - run: uv run python scripts/check_package.py

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'kadubon/collective-intelligence-overlay'
    needs: [validate, windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/collective-intelligence-overlay/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
