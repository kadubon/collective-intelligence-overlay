name: Test, build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: '3.12.14'
      - run: uv sync --all-extras --frozen
      - name: Check actual build interpreter and release ancestry
        run: |
          uv run python -c "import platform,sys; assert platform.python_version()=='3.12.14'; print(sys.version,sys.executable)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            uv run python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME']=='v'+v"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - run: uv build --force-pep517 --python 3.12.14 --out-dir .local/candidate/dist
      - run: uv run twine check --strict .local/candidate/dist/*
      - name: Fix candidate hashes once
        run: |
          uv run python -c "import hashlib,json; from pathlib import Path; p=Path('.local/candidate'); (p/'artifacts.json').write_text(json.dumps({f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in (p/'dist').iterdir() if f.name.endswith(('.whl','.tar.gz'))},indent=2)+'\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-distributions
          path: .local/candidate/
          include-hidden-files: true
          if-no-files-found: error

  linux:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.14', '3.13.15', '3.14.7']
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CIO_TEST_DATABASE_URL: postgresql+pg8000://postgres:test-only-password@127.0.0.1:5432/postgres
      CIO_OPA: ${{ github.workspace }}/.local/bin/opa
      CIO_SCALE_REPORT_DIR: .local/reports/scale
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/fetch_opa.py
      - run: uv run python scripts/ci_validate.py --python-version '${{ matrix.python }}' --candidate .local/candidate --report-dir .local/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-Linux-${{ matrix.python }}
          path: .local/reports/
          include-hidden-files: true
          if-no-files-found: error

  windows:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.14', '3.13.15', '3.14.7']
    env:
      CIO_TEST_DATABASE_URL: postgresql+pg8000://postgres@127.0.0.1:55439/postgres
      CIO_OPA: ${{ github.workspace }}/.local/bin/opa.exe
      CIO_SCALE_REPORT_DIR: .local/reports/scale
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - name: Start a private runner PostgreSQL cluster
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "$env:PGBIN/initdb.exe")) { throw 'runner PostgreSQL missing' }
          $testData = Join-Path $env:RUNNER_TEMP 'cio-postgres'
          if (Test-Path -LiteralPath $testData) { throw 'test cluster directory already exists' }
          & "$env:PGBIN/initdb.exe" -D $testData -U postgres -A trust --encoding=UTF8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PGBIN/pg_ctl.exe" -D $testData -l "$env:RUNNER_TEMP/cio-postgres.log" -o '-h 127.0.0.1 -p 55439' -w -t 60 start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PGBIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:PGBIN/psql.exe" -h 127.0.0.1 -p 55439 -U postgres -c 'SELECT version()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/fetch_opa.py
      - run: uv run python scripts/ci_validate.py --python-version '${{ matrix.python }}' --candidate .local/candidate --report-dir .local/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-Windows-${{ matrix.python }}
          path: .local/reports/
          include-hidden-files: true
          if-no-files-found: error

  mixed:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CIO_TEST_DATABASE_URL: postgresql+pg8000://postgres:test-only-password@127.0.0.1:5432/postgres
      CIO_OPA: ${{ github.workspace }}/.local/bin/opa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: '3.12.14'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - run: uv sync --all-extras --frozen
      - run: uv run python scripts/fetch_opa.py
      - run: uv run python scripts/check_python_interop.py --candidate .local/candidate --minimum 3.12.14 --latest 3.14.7 --report .local/reports/mixed-python.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-mixed
          path: .local/reports/
          include-hidden-files: true
          if-no-files-found: error

  ready:
    needs: [candidate, linux, windows, mixed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.19'
          python-version: '3.12.14'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: .local/candidate
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: reports-*
          path: .local/reports
      - run: uv run --no-project --python 3.12.14 python scripts/check_matrix.py --candidate .local/candidate --reports .local/reports

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'kadubon/collective-intelligence-overlay'
    needs: [candidate, linux, windows, mixed, ready]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/collective-intelligence-overlay/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: candidate-distributions
          path: candidate
      - name: Recheck publish files against the tested manifest
        run: |
          python -c "import hashlib,json; from pathlib import Path; p=Path('candidate'); assert json.loads((p/'artifacts.json').read_text())=={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in (p/'dist').iterdir() if f.name.endswith(('.whl','.tar.gz'))}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: candidate/dist/
